# DEMO 3 — actions fixadas por SHA + permissões mínimas.
# Para descobrir o SHA de uma tag:
#   git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
name: 03 - CI com actions fixadas

on:
  push:
    branches: [main]
  workflow_dispatch:

# Tudo desligado por padrão; cada job pede só o que precisa.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - run: node --version
