name: 04 - Funções de status

on:
  workflow_dispatch:
    inputs:
      falhar:
        description: "Forçar falha no build?"
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Buildando..."
      - if: ${{ inputs.falhar }}
        run: exit 1

  docs:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - run: echo "Publicando docs"

  deploy-ingenuo:
    needs: [build, docs]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy (nunca roda se docs for pulado)"

  deploy:
    needs: [build, docs]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy OK — build=${{ needs.build.result }}, docs=${{ needs.docs.result }}"

  notificar-falha:
    needs: [build]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::error::Build falhou — avisando o time"

  limpeza:
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Limpando recursos temporários (roda sempre)"
